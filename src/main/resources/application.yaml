spring:
  application:
    name: finvibe-profit-worker

  datasource:
    url: ${DB_URL:jdbc:h2:mem:profit_worker;MODE=MySQL;DATABASE_TO_UPPER=false}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: profit-worker
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    properties:
      max.poll.records: ${KAFKA_MAX_POLL_RECORDS:50}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  profit:
    recalculation:
      parallelism: ${PROFIT_RECALCULATION_PARALLELISM:4}
      queue-capacity: ${PROFIT_RECALCULATION_QUEUE_CAPACITY:256}
    redis:
      valuation-save-chunk-size: ${PROFIT_REDIS_VALUATION_SAVE_CHUNK_SIZE:500}
  kafka:
    topics:
      stock-price-updated: ${KAFKA_TOPIC_STOCK_PRICE_UPDATED:market.stock-price-updated.v1}
      portfolio-trade: ${KAFKA_TOPIC_PORTFOLIO_TRADE:trade.trade-executed.v1}
      portfolio-user: ${KAFKA_TOPIC_PORTFOLIO_USER:asset.portfolio-group-changed.v1}
